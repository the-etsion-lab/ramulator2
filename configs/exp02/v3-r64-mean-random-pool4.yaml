# EXP-02 v3-r64-mean-random-pool4: base configs/exp01/P2.yaml, CoWs ratio 64 x assoc 8, table read perbench cyc (source: per benchmark: run EXP-01/20261124-2314-b651ed4/summary-P2-100M.csv, column lat_nonhit_mean), lookup 6 cyc, carve-out lines, 4KB pages. Source placement random, pool footprint4; every touched page renamed and tracked (worst case). C4/C5 open (D-31). Generated by scripts/exp02_config.py.
# table-latency-source: EXP-01/20261124-2314-b651ed4/summary-P2-100M.csv lat_nonhit_mean
Frontend:
  impl: SimpleO3
  ipc: 8
  inst_window_depth: 256
  clock_ratio: 1
  num_expected_insts: __NINSTS__
  latency_factor: 1
  warmup_percent: 25
  dump_raw_latency_samples: false   # D-28: raw per-request latency files are GBs; -cdf files are kept
  traces:
    __TRACES__

  llc_latency: 50
  llc_linesize: 64
  llc_associativity: 8
  llc_num_mshr_per_core: 16
  llc_capacity_per_core: 2MB

  cows_accel_zero_page: false

  cows_enable: true
  cows_carveout: lines
  cows_source_placement: random
  cows_source_pool: __POOL4__
  cows_table_latency_source: "per benchmark: run EXP-01/20261124-2314-b651ed4/summary-P2-100M.csv, column lat_nonhit_mean"
  cows_always_miss: false
  cows_dram_latency_on_translation: __TABLE_LAT__
  cows_cache_access_latency: 6
  cows_cache2llc_ratio: 64
  cows_cache_assoc: 8
  dram_page_bytes: 4KB
  cows_stats_file: cows_stats
  cows_replacement: LRU_nohit

  Translation:
    impl: NoTranslation
    max_addr: 9223372036854775807


MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: DDR5-cow
    drampower_enable: true
    high_temp: false
    org:
      preset: DDR5_64Gb_x8
      channel: 8
      rank: 2
      block_size_as_channel_widths: 16
    timing:
      preset: DDR5_8000C
    voltage:
      preset: Default   # WI-005: without a preset DRAMPower uses V=I=-1 (results/WI-005/F-energy-presets.md)
    current:
      preset: Micron16Gb_RevD_x8_6400   # WI-008: Micron 16Gb Rev D x8 DDR5-6400 IDDs (lit/DDR5-IDD.md); energy via results/common/energy.py (bank-wise)
    RFM:
      BRC: 2

  Controller:
    impl: Generic
    controller_stats_name_prefix: controller_stats
    dump_raw_latency_samples: false   # D-28
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins:

  AddrMapper:
    impl: RoBaRaChCo
    contig_block_bytes: 64
